[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitai-manager"
version = "0.1.0"
description = "CivitAI 模型下载工具 - Windows 桌面应用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "ooUwUoo" }]
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "Jinja2>=3.1",
    "Pillow>=10.0",
    "keyring>=24.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "PyInstaller>=6.0",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "respx>=0.21",
    "ruff>=0.6,<0.15",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.resources" = ["**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
